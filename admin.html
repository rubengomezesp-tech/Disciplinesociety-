<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin imagenes · Discipline Society</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="ds-logo.png">
<style>
  :root{
    --bg:#0a0908;
    --panel:#100f0d;
    --panel-2:#15120f;
    --ink:#f5f2ec;
    --muted:#a8a39a;
    --gold:#c9a961;
    --line:rgba(201,169,97,.2);
    --danger:#d98989;
    --success:#9fcf9f;
    --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Cormorant Garamond","Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{line-height:1.5}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(201,169,97,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,97,.03) 1px,transparent 1px);background-size:80px 80px}
  a{color:inherit}
  button,input{font:inherit}
  button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:12px 16px;letter-spacing:.18em;text-transform:uppercase;font-size:11px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  button:hover:not(:disabled){background:var(--gold);color:var(--bg)}
  button:disabled{opacity:.55;cursor:not-allowed}
  input{width:100%;background:#090807;border:1px solid var(--line);color:var(--ink);padding:12px 13px;outline:none}
  input:focus{border-color:var(--gold)}
  input[type="file"]{padding:10px;background:#080706;color:var(--muted)}
  label{display:grid;gap:8px}
  label span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  [hidden]{display:none !important}
  .shell{position:relative;z-index:1;min-height:100vh}
  .topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(10,9,8,.82);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;gap:14px;text-decoration:none}
  .brand img{width:36px;height:36px;object-fit:contain}
  .brand span{font-family:var(--serif);font-size:17px;letter-spacing:.16em;text-transform:uppercase}
  .brand em{color:var(--gold);font-style:italic}
  .top-actions{display:flex;align-items:center;gap:12px}
  .top-actions a,.admin-email{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none}
  .page{max-width:1240px;margin:0 auto;padding:48px 28px 72px}
  .header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  h1{font-family:var(--serif);font-size:clamp(42px,6vw,78px);font-weight:400;line-height:.95;margin:0}
  h1 em{color:var(--gold);font-style:italic}
  .message{min-height:20px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .message.error{color:var(--danger)}
  .message.success{color:var(--success)}
  .message.info{color:var(--muted)}
  .auth-panel,.denied-panel{width:min(100%,440px);margin:90px auto 0;border:1px solid var(--line);background:rgba(16,15,13,.72);padding:32px}
  .auth-panel h1,.denied-panel h1{font-size:42px;margin-bottom:22px}
  .auth-form{display:grid;gap:18px}
  .auth-form button{margin-top:4px}
  .auth-help{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none;justify-self:end;margin-top:-8px}
  .auth-help:hover{color:var(--gold)}
  .slots-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .image-card{grid-column:span 4;border:1px solid var(--line);background:linear-gradient(180deg,rgba(201,169,97,.04),rgba(255,255,255,.01));display:flex;flex-direction:column;min-width:0}
  .image-card__media{aspect-ratio:4/5;background:#050504;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .image-card__media img{width:100%;height:100%;object-fit:cover;display:block}
  .image-card__body{display:grid;gap:14px;padding:18px}
  .image-card__meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(201,169,97,.14);padding-bottom:12px}
  .image-card__meta span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .image-card__meta strong{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--ink)}
  .image-card__actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .image-card__actions button{padding:11px 8px;font-size:9px}
  .image-card__actions button[data-action="reset"]{border-color:#36302a;color:var(--muted)}
  .image-card__actions button[data-action="reset"]:hover{border-color:var(--danger);background:transparent;color:var(--danger)}
  .card-message{margin:0;min-height:18px;font-size:11px;color:var(--muted)}
  .card-message.error,.message.error{color:var(--danger)}
  .card-message.success,.message.success{color:var(--success)}
  .card-message.info,.message.info{color:var(--muted)}
  @media(max-width:980px){.image-card{grid-column:span 6}.header{align-items:flex-start;flex-direction:column}}
  @media(max-width:640px){
    .topbar{height:auto;padding:16px;align-items:flex-start;gap:16px}
    .top-actions{align-items:flex-end;flex-direction:column}
    .page{padding:34px 16px 60px}
    .auth-panel,.denied-panel{margin-top:42px;padding:24px}
    .image-card{grid-column:1/-1}
    .image-card__actions{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="index.html" class="brand">
      <img src="ds-logo.png" alt="Discipline Society">
      <span>Discipline<em>/</em>Society</span>
    </a>
    <div class="top-actions">
      <a href="index.html">Ver tienda</a>
      <span class="admin-email" id="admin-email" hidden></span>
      <button type="button" id="logout-btn" hidden>Salir</button>
    </div>
  </header>

  <main class="page">
    <section id="login-view" class="auth-panel" hidden>
      <div class="eyebrow">Admin</div>
      <h1>Imagenes</h1>
      <form id="admin-login-form" class="auth-form">
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          <span>Contrasena</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <a class="auth-help" href="recuperar.html">Resetear contrasena</a>
        <button type="submit">Entrar</button>
        <p id="login-message" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section id="denied-view" class="denied-panel" hidden>
      <div class="eyebrow">Sin permiso</div>
      <h1>No autorizado</h1>
      <p id="denied-message" class="message error">Tu usuario no esta en la tabla site_admins.</p>
    </section>

    <section id="admin-view" hidden>
      <div class="header">
        <div>
          <div class="eyebrow">Admin imagenes</div>
          <h1>Cambia cada <em>seccion.</em></h1>
        </div>
        <div>
          <button type="button" id="refresh-btn">Actualizar</button>
          <p id="global-message" class="message" aria-live="polite"></p>
        </div>
      </div>
      <div id="slots-grid" class="slots-grid"></div>
    </section>
  </main>
</div>

<script type="module" src="./assets/js/admin-images.js"></script>
</body>
</html>
