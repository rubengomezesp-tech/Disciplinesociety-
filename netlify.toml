# =========================================
# Discipline Society · Netlify configuration
# =========================================

[build]
  publish = "."
  functions = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://api.stripe.com https://checkout.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# HTML should revalidate quickly because this project does not fingerprint files.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/pdf/*.pdf"
  [headers.values]
    Cache-Control = "private, max-age=0, must-revalidate"

# Pretty URLs for static pages.
[[redirects]]
  from = "/acceder"
  to = "/acceder.html"
  status = 200

[[redirects]]
  from = "/registro"
  to = "/registro.html"
  status = 200

[[redirects]]
  from = "/mi-cuenta"
  to = "/mi-cuenta.html"
  status = 200

[[redirects]]
  from = "/recuperar"
  to = "/recuperar.html"
  status = 200

[[redirects]]
  from = "/nueva-contrasena"
  to = "/nueva-contrasena.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/gracias.html"
  status = 200

[[redirects]]
  from = "/confirmado"
  to = "/confirmado.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/cancel"
  to = "/cancel.html"
  status = 200

[[redirects]]
  from = "/guia"
  to = "/assets/pdf/guia-privada.pdf"
  status = 302
